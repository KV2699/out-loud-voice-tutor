<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out Loud — opening</title>
<style>
  /* Deliberately the product's own visual language, not a separate "video
     brand" — same white ground, same ink, same blue, same type stack as the
     tutor page. A title card that looks like a different product is the
     commonest way a hackathon video reads as two things bolted together. */
  :root{
    --page:#ffffff;
    --ink:#141414;
    --ink-faint:#5c5c5c;
    --blue-600:#1e40af;
    --blue-500:#1d4ed8;
    --blue-100:#dbeafe;
    --line:rgba(20,20,20,.13);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--page);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:grid;place-items:center;overflow:hidden;
  }

  .card{
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:26px;padding:6vh 7vw;max-width:1100px;
  }
  .card.is-on{display:flex;}

  .eyebrow{
    margin:0;font-size:clamp(.66rem,1.2vw,.8rem);font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:var(--blue-600);
  }
  .title{
    margin:0;font-size:clamp(2.8rem,8vw,5.6rem);font-weight:800;
    letter-spacing:-.035em;line-height:.98;text-wrap:balance;
  }
  .title em{font-style:normal;color:var(--blue-500);}
  .tag{
    margin:0;font-size:clamp(1.05rem,2.3vw,1.6rem);color:var(--ink);
    font-weight:500;max-width:22ch;line-height:1.28;text-wrap:balance;
  }

  .rule{width:64px;height:3px;background:var(--blue-500);border-radius:2px;}

  .meta{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;
    font-size:clamp(.78rem,1.4vw,.98rem);color:var(--ink-faint);
  }
  .meta b{color:var(--ink);font-weight:600;}

  /* the orb, reused at card scale so the two cards and the product match */
  .orb{
    width:clamp(84px,11vw,132px);aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 4%, rgba(255,255,255,0) 13%),
      radial-gradient(circle at 70% 82%, hsla(226 100% 82% / .5) 0%, transparent 42%),
      radial-gradient(circle at 36% 30%,
        hsl(226 85% 72%) 0%, hsl(226 85% 55%) 38%,
        hsl(238 85% 40%) 72%, hsl(246 85% 32%) 100%);
    box-shadow:0 22px 40px -18px hsla(226 70% 40% / .5),
               inset 0 -12px 22px -10px hsla(226 90% 22% / .5),
               inset 0 8px 18px -8px rgba(255,255,255,.4);
    -webkit-mask-image:radial-gradient(circle, #000 98.5%, transparent 100%);
            mask-image:radial-gradient(circle, #000 98.5%, transparent 100%);
  }

  .links{
    display:flex;flex-direction:column;gap:9px;
    font-size:clamp(.92rem,1.7vw,1.15rem);
  }
  .links span{color:var(--ink-faint);}
  .links b{color:var(--blue-600);font-weight:600;word-break:break-all;}

</style>
</head>
<body>

  <div class="card is-on">
    <div class="orb" aria-hidden="true"></div>
    <p class="eyebrow">AssemblyAI Voice Agent Hackathon</p>
    <h1 class="title">Out <em>Loud</em></h1>
    <p class="tag">Courseware you operate by voice.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="meta">
      <span>Team <b>Out Loud</b></span>
      <span>Solo entry</span>
      <span>Built on the <b>AssemblyAI Voice Agent API</b></span>
    </div>
  </div>

</body>
</html>
